<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Connecting TikTok - SJI DEV</title>
<style>
 body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;color:#1c1e21;margin:0;display:grid;place-items:center;min-height:100vh}
 .card{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.15);padding:28px 32px;max-width:440px;text-align:center}
 h1{font-size:20px;margin:0 0 10px}
 p{color:#65676b;font-size:15px;line-height:1.5}
 a.btn{display:inline-block;margin-top:8px;background:#1877f2;color:#fff;text-decoration:none;padding:10px 18px;border-radius:6px;font-weight:600}
 .err{color:#c62828}
</style>
</head><body>
<div class="card">
 <h1 id="t">Connecting your TikTok account...</h1>
 <p id="m">Taking you back to the SJI DEV scheduler.</p>
 <p id="b"></p>
</div>
<script>
// TikTok sends the sign-in result here (an HTTPS page, as TikTok requires).
// This page only forwards it to the scheduler app; it stores and sends nothing anywhere else.
// The address of the scheduler app. Change it if the app does not run at this address.
var APP_URL = 'http://localhost:8080';

(function () {
  var q = window.location.search;
  var params = new URLSearchParams(q);
  if (!params.get('state')) {
    document.getElementById('t').textContent = 'Nothing to do here';
    document.getElementById('m').textContent = 'This page is only used while connecting a TikTok account from the SJI DEV scheduler.';
    return;
  }
  var target = APP_URL.replace(/\/+$/, '') + '/auth/tiktok/callback' + q;
  // Remove the one-time code from this page's address and browser history.
  try { history.replaceState(null, '', window.location.pathname); } catch (e) {}
  var b = document.getElementById('b');
  var a = document.createElement('a');
  a.className = 'btn'; a.href = target; a.textContent = 'Continue to the scheduler';
  b.appendChild(a);
  window.location.replace(target);
  setTimeout(function () {
    document.getElementById('m').innerHTML = 'If nothing happens, make sure the scheduler app is running on this computer at <b></b>, then click the button.';
    document.querySelector('#m b').textContent = APP_URL;
  }, 2500);
})();
</script>
</body></html>
